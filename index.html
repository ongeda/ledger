<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recordable · Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F7D78">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  :root{
    --bg:#E7F0F6; --card:#FFFFFF; --ink:#26313B; --muted:#7A8793; --line:#DCE6EE;
    --teal:#2F7D78; --teal-soft:#DDEFEC; --coral:#E9806E; --coral-soft:#FCE7E2;
    --chip:#F1F5F8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px;}

  .wrap{max-width:1360px;margin:0 auto;padding:16px;}

  /* header */
  .hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .logo-row{display:flex;align-items:center;gap:12px;}
  .logo{width:44px;height:44px;border-radius:16px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .app-name{font-size:18px;font-weight:700;line-height:1.2;}
  .tagline{font-size:12px;color:var(--muted);}
  .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .icon-btn{width:34px;height:34px;border-radius:999px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .icon-btn:hover{background:var(--chip);}
  .ym{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:15px;}
  .ym input{width:62px;border:none;background:transparent;font-weight:700;text-align:right;padding:4px 0;}
  .ym select{border:none;background:transparent;font-weight:700;padding:4px 0;}
  .pill-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;}
  .pill-btn:hover{background:var(--chip);}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px;}
  .seg button{border:none;background:transparent;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted);}
  .seg button.on{background:var(--teal);color:#fff;}
  .sel-sm{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;}

  /* board */
  .board{display:grid;grid-template-columns:272px minmax(0,1fr) 272px;grid-template-areas:"left center right";gap:16px;align-items:start;}
  .col-left{grid-area:left;} .col-right{grid-area:right;} .col-center{grid-area:center;}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .card{background:var(--card);border-radius:22px;padding:18px;border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 0 rgba(38,49,59,.04);}

  /* category card */
  .cat{border-radius:22px;padding:16px;}
  .cat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .cat-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;min-width:0;}
  .cat-emoji{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .cat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ghost{border:none;background:transparent;padding:4px;border-radius:8px;display:inline-flex;opacity:.65;}
  .ghost:hover{opacity:1;background:rgba(255,255,255,.6);}
  .cat-month{margin-top:10px;display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
  .cat-month .lbl{font-size:12px;opacity:.8;}
  .cat-month .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .bud{margin-top:6px;}
  .bud-track{height:6px;border-radius:999px;background:rgba(255,255,255,.8);overflow:hidden;}
  .bud-fill{height:100%;border-radius:999px;}
  .bud-txt{display:flex;justify-content:space-between;font-size:11px;margin-top:4px;opacity:.85;}
  .bud-txt .over{color:#C4553F;font-weight:700;opacity:1;}
  .cat-day{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(38,49,59,.14);}
  .cat-day-lbl{font-size:12px;font-weight:600;opacity:.8;margin-bottom:6px;display:flex;justify-content:space-between;}
  .entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .entry{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.78);border-radius:12px;padding:7px 8px 7px 10px;}
  .entry .it{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px;border:none;background:none;text-align:left;padding:0;}
  .entry .am{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;border:none;background:none;padding:0;}
  .entry .x{border:none;background:none;padding:2px;opacity:.45;display:inline-flex;}
  .entry .x:hover{opacity:1;}
  .empty{font-size:12px;opacity:.6;padding:4px 2px;}
  .qa{display:flex;gap:6px;margin-top:8px;}
  .qa input{min-width:0;border:1px solid rgba(38,49,59,.12);background:rgba(255,255,255,.9);border-radius:10px;padding:8px 9px;font-size:13px;}
  .qa .qi{flex:1.3;} .qa .qm{flex:1;text-align:right;font-variant-numeric:tabular-nums;}
  .qa .add{border:none;border-radius:10px;padding:0 10px;color:#fff;font-weight:700;flex-shrink:0;}
  .edit-row{display:flex;gap:6px;align-items:center;background:#fff;border-radius:12px;padding:6px;}
  .edit-row input{min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;}
  .mini{border:none;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;}
  .mini.pri{background:var(--teal);color:#fff;} .mini.sec{background:var(--chip);}
  .cat-form{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .cat-form .row{display:flex;gap:6px;}
  .cat-form input{min-width:0;border:1px solid rgba(38,49,59,.14);background:#fff;border-radius:10px;padding:8px 9px;}
  .cat-form .emo{width:52px;text-align:center;font-size:16px;}
  .cat-form .nm{flex:1;}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;}
  .emo-lbl{font-size:12px;font-weight:600;opacity:.8;}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;background:rgba(255,255,255,.7);border-radius:12px;padding:6px;}
  .emoji-grid .em{border:none;background:transparent;border-radius:8px;font-size:17px;line-height:1;padding:5px 0;}
  .emoji-grid .em:hover{background:#fff;}
  .emoji-grid .em.on{background:#fff;box-shadow:0 0 0 2px currentColor;}
  button.cat-emoji{border:none;padding:0;}
  .sw{width:24px;height:24px;border-radius:999px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(38,49,59,.15);padding:0;}
  .sw.on{box-shadow:0 0 0 2px var(--ink);}
  .form-btns{display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap;}
  .danger{border:none;background:transparent;color:#C4553F;font-size:12px;font-weight:600;padding:6px 4px;}
  .add-cat{border:1.5px dashed rgba(47,125,120,.45);background:rgba(255,255,255,.45);color:var(--teal);border-radius:18px;padding:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}
  .add-cat:hover{background:rgba(255,255,255,.8);}

  /* summary */
  .sum-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .sum-lbl{font-size:12px;color:var(--muted);font-weight:600;}
  .sum-total{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;}
  .sum-side{display:flex;gap:18px;}
  .sum-side .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--chip);margin-top:14px;}
  .stack span{height:100%;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;}
  .legend .li{display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex-shrink:0;}
  .legend .pc{color:var(--muted);font-variant-numeric:tabular-nums;}
  .sum-empty{margin-top:10px;font-size:13px;color:var(--muted);}
  .flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;}
  .fb{border-radius:16px;padding:12px 14px;min-width:0;}
  .fb .fl{font-size:12px;font-weight:600;opacity:.85;}
  .fb .fv{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere;}
  .fb .fr{font-size:11px;font-weight:600;opacity:.8;margin-top:2px;}
  .fb.inc{background:#E3F4EA;color:#2C7050;}
  .fb.exp{background:#FCE9E4;color:#B24A35;}
  .fb.bal{background:#DDEEEC;color:#245F5B;}
  .fb.bal.neg{background:#F9DEDA;color:#B0392A;}
  .sum-meta{margin-top:8px;font-size:12px;color:var(--muted);}
  .inc-card{border:1.5px solid #CBE8D6;}
  .inc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .inc-title{font-weight:700;font-size:15px;}
  .inc-sum{font-weight:800;font-size:18px;color:#2C7050;font-variant-numeric:tabular-nums;}
  .inc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .inc-list li,.inc-rec-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#F0F8F3;}
  .inc-list .idate{font-size:12px;font-weight:700;color:#2C7050;min-width:36px;font-variant-numeric:tabular-nums;}
  .inc-list .it,.inc-rec-row .it{flex:1;min-width:0;overflow-wrap:anywhere;}
  .inc-list .am,.inc-rec-row .am{font-weight:700;color:#2C7050;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .inc-rec{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .inc-card .chk{flex:0 0 auto;}
  .day-add .add.inc-add{background:#3E9A6B;}
  .cell .amt.inc{color:#2C7050;margin-top:auto;}
  .cell .amt.tight{margin-top:0;}
  .tot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);}
  .tot-title{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .tot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;}
  .tot-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;min-width:0;}
  .tot-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tot-row .pc{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}
  .tot-row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .tot-row.zero{opacity:.5;}
  .tot-row.grand{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);font-size:15px;font-weight:700;}
  .rb{display:inline-block;font-size:10px;font-weight:700;background:rgba(38,49,59,.08);border-radius:6px;padding:0 5px;vertical-align:1px;}
  .rday{display:block;font-size:11px;opacity:.7;}
  .qa .qd{flex:.55;text-align:center;}
  .entry .edate{font-size:11px;font-weight:700;opacity:.75;min-width:32px;font-variant-numeric:tabular-nums;}
  .rec-on{font-size:11px;margin-top:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .rec-on .chk{font-size:11px;gap:4px;}
  /* saving insights */
  .bud-track{position:relative;}
  .pace-mark{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(38,49,59,.55);}
  .pace{font-size:11px;margin-top:3px;opacity:.9;}
  .pace .fast{color:#C4553F;font-weight:700;}
  .dl{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);}
  .dl.up{color:#C4553F;} .dl.down{color:#2C7050;}
  .cmp{margin-top:4px;font-size:12px;color:var(--muted);}
  .tb{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--chip);font-size:12px;}
  .tb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:600;}
  .tb-head .over{color:#C4553F;font-weight:700;}
  .tb-lbl{display:inline-flex;align-items:center;gap:2px;font-weight:700;}
  .tb-pen{padding:2px;}
  .tb-track{background:#fff;}
  .tb .pace{font-size:12px;margin-top:6px;}
  .tb-set{border:1.5px dashed rgba(47,125,120,.45);background:transparent;color:var(--teal);border-radius:10px;padding:6px 10px;font-weight:700;font-size:12px;}
  .tb-edit{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .tb-edit input{flex:1 1 140px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right;}
  body.capturing .tb-set, body.capturing .tb-pen{display:none !important;}
  .side-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;}

  /* calendar */
  .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px;}
  .wk div{text-align:center;font-size:12px;font-weight:600;color:var(--muted);}
  .wk div:first-child{color:var(--coral);} .wk div:last-child{color:#5B84B1;}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .cell{position:relative;min-height:78px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:7px 7px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0;}
  .cell:hover{border-color:#B9CBD8;}
  .cell .heat{position:absolute;inset:0;background:var(--teal);pointer-events:none;}
  .cell > *:not(.heat){position:relative;}
  .cell .num{font-size:12px;font-weight:700;}
  .cell.sun .num{color:var(--coral);} .cell.sat .num{color:#5B84B1;}
  .cell.today .num{background:var(--coral);color:#fff;border-radius:999px;padding:0 7px;align-self:flex-start;}
  .cell.sel{border:2px solid var(--teal);padding:6px 6px 5px;}
  .cell .amt{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:auto;}
  .cell .dots{display:flex;gap:3px;flex-wrap:wrap;}
  .blank{min-height:78px;}
  .amt-short{display:none;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;}
  .cal-title{font-weight:700;font-size:15px;}
  .hint{font-size:12px;color:var(--muted);}

  /* day detail */
  .day-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .badge{width:42px;height:42px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0;}
  .day-title{font-weight:700;font-size:15px;}
  .day-sub{font-size:12px;color:var(--muted);}
  .day-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .day-list li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--chip);}
  .chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;}
  .day-list .it{flex:1;min-width:0;overflow-wrap:anywhere;}
  .day-list .am{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .day-add{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .day-add select,.day-add input{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:#fff;min-width:0;}
  .day-add .qi{flex:2 1 120px;} .day-add .qm{flex:1 1 80px;text-align:right;}
  .day-add .add{border:none;border-radius:10px;padding:8px 14px;background:var(--teal);color:#fff;font-weight:700;}
  .day-total{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:700;}

  body.capturing .qa, body.capturing .day-add, body.capturing .rec-on, body.capturing .add-cat,
  body.capturing .tools, body.capturing .icon-btn, body.capturing .pill-btn, body.capturing .ghost,
  body.capturing .entry .x, body.capturing .inc-card .hint{display:none !important;}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:1080px){
    .board{grid-template-columns:1fr 1fr;grid-template-areas:"center center" "left right";}
  }
  @media (max-width:640px){
    .wrap{padding:12px;}
    .board{grid-template-columns:1fr;grid-template-areas:"center" "left" "right";}
    .cell,.blank{min-height:58px;}
    .cell{padding:5px 4px;border-radius:10px;}
    .cell.sel{padding:4px 3px;}
    .cell .amt{font-size:11px;}
    .amt-full{display:none;} .amt-short{display:block;}
    .grid,.wk{gap:4px;}
    .sum-total{font-size:26px;}
    .tot-grid{grid-template-columns:1fr;}
    .flow{grid-template-columns:1fr 1fr;gap:6px;} .fb.bal{grid-column:1 / -1;} .fb{padding:10px 12px;} .fb .fv{font-size:19px;white-space:nowrap;overflow-wrap:normal;}
  }
  @media (prefers-reduced-motion:reduce){ .toast{transition:none;} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="restore-file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="sync.js"></script>
<script>
(function(){
  'use strict';
  var KEY = 'recordable-ledger-v1';
  var LANG_KEY = 'recordable-lang'; // 언어는 기기별 설정 (공용 데이터와 분리해 동기화하지 않음)

  var PALETTE = [
    {bg:'#FFF6DA', dot:'#E0B43A', ink:'#6E5A1D'},
    {bg:'#FDE8ED', dot:'#E3869D', ink:'#833B4E'},
    {bg:'#E3F3EA', dot:'#56AE86', ink:'#2C654B'},
    {bg:'#ECE6F8', dot:'#9A84D0', ink:'#4F3F84'},
    {bg:'#FDEBDD', dot:'#EC9563', ink:'#83461F'},
    {bg:'#E2EDF9', dot:'#6C9FD6', ink:'#2B527C'}
  ];
  var CUR = {
    KRW:{sym:'₩', dec:0},
    CNY:{sym:'¥', dec:2},
    USD:{sym:'$', dec:2}
  };

  var T = {
    ko:{

  /* ---------- saving insights: last-month comparison, budget pace ---------- */
  function viewInfo(){
    var dim = new Date(ui.y, ui.m+1, 0).getDate();
    var isCur = ui.y===now.getFullYear() && ui.m===now.getMonth();
    return {dim:dim, isCur:isCur, day: isCur ? now.getDate() : dim};
  }
  function dayOf(e){ return +e.date.slice(8,10); }
  // this month (1..today when viewing the current month) vs the same days of the previous month
  function prevCompare(){
    var v = viewInfo(), pd = new Date(ui.y, ui.m-1, 1);
    var pdim = new Date(pd.getFullYear(), pd.getMonth()+1, 0).getDate();
    var cut = v.day, pcut = v.isCur ? Math.min(cut, pdim) : pdim;
    return {
      cur: monthEntries().filter(function(e){ return dayOf(e)<=cut; }),
      prev: entriesFor(pd.getFullYear(), pd.getMonth()).filter(function(e){ return dayOf(e)<=pcut; }),
      cut: cut, partial: v.isCur
    };
  }
  function deltaHtml(cur, prev, withAmt){
    var L = t();
    if(!prev && !cur) return '';
    if(!prev) return '<span class="dl up">'+esc(L.newTag)+'</span>';
    var diff = Math.round((cur-prev)*100)/100, pct = Math.round(diff/prev*100);
    if(Math.abs(diff) < 0.005) return '<span class="dl">±0%</span>';
    var up = diff > 0;
    return '<span class="dl '+(up?'up':'down')+'">'+(up?'▲':'▼')+(withAmt?' '+fmt(Math.abs(diff))+' ':'')+(withAmt?'(':'')+(up?'+':'−')+Math.abs(pct)+'%'+(withAmt?')':'')+'</span>';
  }
  // spentToDate: expenses dated up to today; committed: everything in the month (incl. scheduled fixed costs)
  function paceHtml(budget, spentToDate, committed){
    var L = t(), v = viewInfo();
    if(!(budget > 0) || !v.isCur) return '';
    var expected = budget * v.day / v.dim, remDays = v.dim - v.day + 1;
    var room = Math.max(0, budget - committed), gap = Math.round((spentToDate - expected)*100)/100;
    var head = gap > 0 ? '<span class="fast">'+esc(L.paceFast(fmt(gap)))+'</span>' : esc(L.paceOk(fmt(-gap)));
    var tail = room > 0 ? esc(L.perDay(remDays, fmt(Math.floor(room/remDays*100)/100))) : '<span class="fast">'+esc(L.noRoom)+'</span>';
    return '<div class="pace">'+head+' · '+tail+'</div>';
  }
  function paceMark(budget){
    var v = viewInfo();
    if(!(budget > 0) || !v.isCur) return '';
    return '<span class="pace-mark" style="left:'+(v.day/v.dim*100).toFixed(1)+'%" title="'+esc(t().expectedLbl)+'"></span>';
  }
  function toDateSum(list){ var d = viewInfo().day; return sum(list.filter(function(e){ return dayOf(e)<=d; })); }

  function renderTotalBudget(total, list){
    var L = t(), b = data.budget || 0;
    if(ui.editingBudget){
      return '<div class="tb"><div class="tb-edit"><span class="tb-lbl">'+esc(L.totalBudget)+'</span>' +
        '<input id="tb-in" inputmode="decimal" data-enter="save-budget" placeholder="'+esc(L.budgetPh2)+'" value="'+(b||'')+'">' +
        '<button class="mini sec" data-action="cancel-budget">'+esc(L.cancel)+'</button>' +
        '<button class="mini pri" data-action="save-budget">'+esc(L.save)+'</button></div></div>';
    }
    if(!(b > 0)) return '<div class="tb"><button class="tb-set" data-action="edit-budget">'+esc(L.setBudget)+'</button></div>';
    var over = total > b, w = Math.min(100, total/b*100);
    return '<div class="tb">' +
      '<div class="tb-head"><span class="tb-lbl">'+esc(L.totalBudget)+' '+fmt(b)+' <button class="ghost tb-pen" data-action="edit-budget" aria-label="'+esc(L.totalBudget)+'">'+ICON.pencil+'</button></span>' +
        (over ? '<span class="over">'+esc(L.over)+' '+fmt(total-b)+'</span>' : '<span>'+esc(L.left)+' '+fmt(b-total)+'</span>') + '</div>' +
      '<div class="bud-track tb-track"><div class="bud-fill" style="width:'+w.toFixed(1)+'%;background:'+(over?'#D9644D':'var(--teal)')+'"></div>'+paceMark(b)+'</div>' +
      paceHtml(b, toDateSum(list), total) + '</div>';
  }

  function renderSummary(){
    var L = t();
    var list = monthEntries(), total = sum(list);
    var incList = monthIncome(), incTotal = sum(incList), bal = Math.round((incTotal - total)*100)/100;
    var dim = new Date(ui.y, ui.m+1, 0).getDate();
    var isCur = ui.y===now.getFullYear() && ui.m===now.getMonth();
    var days = isCur ? now.getDate() : dim;
    var cmp = prevCompare();
    var catDelta = function(id){
      var f = function(e){ return e.cat===id; };
      return deltaHtml(sum(cmp.cur.filter(f)), sum(cmp.prev.filter(f)), false);
    };
    var cmpCur = sum(cmp.cur), cmpPrev = sum(cmp.prev);
    var cmpHtml = (cmpCur || cmpPrev) ? '<div class="cmp">' +
      (cmp.partial ? esc(L.spentToDate(fmt(cmpCur)))+' · '+esc(L.cmpSame(cmp.cut, fmt(cmpPrev))) : esc(L.cmpFull(fmt(cmpPrev)))) +
      ' '+deltaHtml(cmpCur, cmpPrev, true)+'</div>' : '';
    var all = data.cats.map(function(c){ return {c:c, v:sum(list.filter(function(e){return e.cat===c.id;}))}; });
    var parts = all.filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
    var inner = '';
    if(!list.length){
      inner = '<div class="sum-empty">'+esc(L.noData)+'</div>';
    } else {
      inner = '<div class="stack">' + parts.map(function(x){ return '<span style="width:'+(x.v/total*100).toFixed(2)+'%;background:'+pal(x.c).dot+'" title="'+esc(catName(x.c))+'"></span>'; }).join('') + '</div>';
    }
    inner += '<div class="tot"><div class="tot-title">'+esc(L.totalsTitle)+'</div><div class="tot-grid">' +
      all.map(function(x){
        var p = pal(x.c);
        return '<div class="tot-row'+(x.v?'':' zero')+'"><span class="dot" style="background:'+p.dot+'"></span>' +
          '<span class="nm">'+esc(x.c.emoji+' '+catName(x.c))+'</span>' +
          '<span class="pc">'+(total?Math.round(x.v/total*100):0)+'%</span>' +
          catDelta(x.c.id) +
          '<span class="v">'+fmt(x.v)+'</span></div>';
      }).join('') + '</div>' +
      '<div class="tot-row grand"><span class="nm">'+esc(L.grand)+'</span><span class="v">'+fmt(total)+'</span></div></div>';
    return '<section class="card">' +
      '<div class="sum-lbl">'+esc(L.monthLabel(ui.y,ui.m))+'</div>' +
      '<div class="flow">' +
        '<div class="fb inc"><div class="fl">'+esc(L.incomeTitle)+'</div><div class="fv">+'+fmt(incTotal)+'</div></div>' +
        '<div class="fb exp"><div class="fl">'+esc(L.expenseTitle)+'</div><div class="fv">−'+fmt(total)+'</div></div>' +
        '<div class="fb bal'+(bal<0?' neg':'')+'"><div class="fl">'+esc(L.balance)+'</div><div class="fv">'+(bal<0?'−':'')+fmt(Math.abs(bal))+'</div>' +
          (incTotal>0?'<div class="fr">'+esc(L.saveRate(Math.round(bal/incTotal*100)))+'</div>':'')+'</div>' +
      '</div>' +
      '<div class="sum-meta">'+esc(L.meta(fmt(days?(isCur?toDateSum(list):total)/days:0), list.length, incList.length))+'</div>' +
      cmpHtml + renderTotalBudget(total, list) +
      inner + '</section>';
  }

  function renderCalendar(){
    var L = t();
    var first = new Date(ui.y, ui.m, 1), dim = new Date(ui.y, ui.m+1, 0).getDate();
    var list = monthEntries(), byDay = {}, max = 0;
    list.forEach(function(e){
      var d = byDay[e.date] || (byDay[e.date] = {total:0, cats:{}});
      d.total += e.amount; d.cats[e.cat] = true;
    });
    Object.keys(byDay).forEach(function(k){ if(byDay[k].total>max) max = byDay[k].total; });
    var incDay = {};
    monthIncome().forEach(function(e){ incDay[e.date] = (incDay[e.date]||0) + e.amount; });
    var todayIso = iso(now);
    var cells = '';
    for(var b=0;b<first.getDay();b++) cells += '<div class="blank"></div>';
    for(var d=1; d<=dim; d++){
      var dt = new Date(ui.y, ui.m, d), k = iso(dt), info = byDay[k];
      var cls = 'cell' + (dt.getDay()===0?' sun':'') + (dt.getDay()===6?' sat':'') + (k===todayIso?' today':'') + (k===ui.sel?' sel':'');
      var heat = info && max ? '<span class="heat" style="opacity:'+(0.05+0.25*Math.sqrt(info.total/max)).toFixed(3)+'"></span>' : '';
      var dots = '';
      if(info){ data.cats.forEach(function(c){ if(info.cats[c.id]) dots += '<span class="dot" style="background:'+pal(c).dot+'"></span>'; }); }
      cells += '<button class="'+cls+'" data-action="select" data-date="'+k+'" aria-pressed="'+(k===ui.sel)+'">' + heat +
        '<span class="num">'+d+'</span>' +
        (dots?'<span class="dots">'+dots+'</span>':'') +
        (incDay[k]?'<span class="amt inc amt-full">+'+fmt(incDay[k])+'</span><span class="amt inc amt-short">+'+fmtShort(incDay[k])+'</span>':'') +
        (info?'<span class="amt'+(incDay[k]?' tight':'')+' amt-full">'+fmt(info.total)+'</span><span class="amt'+(incDay[k]?' tight':'')+' amt-short">'+fmtShort(info.total)+'</span>':'') +
        '</button>';
    }
    return '<section class="card">' +
      '<div class="cal-head"><div class="cal-title">'+esc(L.monthLabel(ui.y,ui.m))+'</div><div class="hint">'+esc(L.calHint)+'</div></div>' +
      '<div class="wk">'+L.weekdays.map(function(w){return '<div>'+esc(w)+'</div>';}).join('')+'</div>' +
      '<div class="grid">'+cells+'</div></section>';
  }

  function renderDay(){
    var L = t(), d = fromIso(ui.sel), list = dayEntries(ui.sel), inc = dayIncome(ui.sel);
    var isToday = ui.sel === iso(now);
    var incRows = inc.map(function(e){
      return '<li class="inc-li"><span class="chip" style="background:#DDF1E5;color:#2C7050">💰 '+esc(L.income)+'</span>' +
        '<span class="it">'+(e.rec?'<span class="rb">'+esc(L.recBadge)+'</span> ':'')+esc(e.item||'—')+'</span><span class="am" style="color:#2C7050">+'+fmt(e.amount)+'</span>' +
        '<button class="ghost" data-action="del-inc" data-id="'+e.id+'" aria-label="'+esc(L.delEntry)+'">'+ICON.x+'</button></li>';
    }).join('');
    var rows = (list.length||inc.length) ? '<ul class="day-list">' + incRows + list.map(function(e){
      var c = catById(e.cat) || data.cats[0], p = pal(c);
      return '<li><span class="chip" style="background:'+p.bg+';color:'+p.ink+'">'+esc(c.emoji+' '+catName(c))+'</span>' +
        '<span class="it">'+(e.rec?'<span class="rb">'+esc(L.recBadge)+'</span> ':'')+esc(e.item||'—')+'</span><span class="am">'+fmt(e.amount)+'</span>' +
        '<button class="ghost" data-action="del-entry" data-id="'+e.id+'" aria-label="'+esc(L.delEntry)+'">'+ICON.x+'</button></li>';
    }).join('') + '</ul>' : '<div class="empty" style="color:var(--muted);opacity:1">'+esc(L.dayEmpty)+'</div>';
    var catOpts = data.cats.map(function(c){ return '<option value="'+c.id+'"'+(ui.drafts['d-cat']===c.id?' selected':'')+'>'+esc(c.emoji+' '+catName(c))+'</option>'; }).join('');
    return '<section class="card">' +
      '<div class="day-head"><div class="badge" style="background:'+(isToday?'var(--coral)':'var(--teal)')+'">'+d.getDate()+'</div>' +
        '<div><div class="day-title">'+esc(L.dayLabel(d))+'</div><div class="day-sub">'+(list.length+inc.length)+' '+esc(L.records)+'</div></div></div>' +
      rows +
      ((list.length||inc.length) ? '<div class="day-total"><span>'+esc(L.dayTotal)+'</span><span>' +
        (inc.length?'<span style="color:#2C7050">'+esc(L.income)+' +'+fmt(sum(inc))+'</span>&nbsp;&nbsp;':'') +
        esc(L.expense)+' '+fmt(sum(list))+'</span></div>' : '') +
      '<div class="day-add">' +
        '<select id="d-cat" data-draft="d-cat" aria-label="'+esc(L.category)+'">'+catOpts+'</select>' +
        '<input class="qi" id="d-i" data-draft="d-i" data-enter="add-day" placeholder="'+esc(L.itemPh)+'" value="'+esc(ui.drafts['d-i']||'')+'">' +
        '<input class="qm" id="d-m" data-draft="d-m" data-enter="add-day" inputmode="decimal" placeholder="'+esc(L.amountPh)+'" value="'+esc(ui.drafts['d-m']||'')+'">' +
        '<label class="chk"><input type="checkbox" id="d-rec"'+(ui.dRec?' checked':'')+'> '+esc(L.monthlyFixed)+'</label>' +
        '<button class="add" data-action="add-day">'+esc(L.add)+'</button>' +
      '</div></section>';
  }

  /* ---------- actions ---------- */
  function addEntry(catId, item, amtStr, focusId, draftPrefix, draftSuffixes, asRecurring){
    var amt = parseAmt(amtStr);
    if(!(amt > 0)){ toast(t().invalidAmt); ui.focus = focusId.replace(/^qi-|^d-i$/, function(m){ return m==='d-i'?'d-m':'qm-'; }); render(); return; }
    if(asRecurring){
      // monthly fixed expense: repeats on this day every month from the selected month on
      var day = fromIso(ui.sel).getDate();
      data.recurring.push({id:uid(), cat:catId, item:String(item||'').trim(), amount:amt, day:day, start:ui.sel.slice(0,7), skip:{}, over:{}});
      toast(t().recAdded(day));
      ui.dRec = false; ui.qRec[catId] = false;
    } else {
      data.entries.push({id:uid(), date:ui.sel, cat:catId, item:String(item||'').trim(), amount:amt});
    }
    save();
    draftSuffixes.forEach(function(k){ delete ui.drafts[draftPrefix+k]; });
    ui.focus = focusId;
    render();
  }

  function goMonth(y, m){
    var d = new Date(y, m, 1);
    ui.y = d.getFullYear(); ui.m = d.getMonth();
    ui.sel = (ui.y===now.getFullYear() && ui.m===now.getMonth()) ? iso(now) : iso(d);
    ui.editingEntry = null;
    render();
  }

  function download(name, text, type){
    var blob = new Blob([text], {type:type});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  var H2C_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  function loadH2C(){
    return new Promise(function(res, rej){
      if(window.html2canvas) return res(window.html2canvas);
      var urls = [H2C_URL, 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'];
      (function tryNext(i){
        if(i >= urls.length) return rej();
        var sc = document.createElement('script');
        sc.src = urls[i];
        sc.onload = function(){ window.html2canvas ? res(window.html2canvas) : tryNext(i+1); };
        sc.onerror = function(){ sc.remove(); tryNext(i+1); };
        document.head.appendChild(sc);
      })(0);
    });
  }
  var shooting = false;
  function takeShot(){
    if(shooting) return; shooting = true;
    toast(t().shotBusy);
    ui.editingEntry = null; ui.editingCat = null; render();
    loadH2C().then(function(h2c){
      document.body.classList.add('capturing');
      var target = document.getElementById('app');
      return h2c(target, {backgroundColor:getComputedStyle(document.body).backgroundColor, scale:2, useCORS:true, logging:false,
        windowWidth: document.documentElement.scrollWidth});
    }).then(function(canvas){
      document.body.classList.remove('capturing');
      var name = 'recordable-ledger-'+ymKey(ui.y,ui.m)+'.png';
      canvas.toBlob(function(blob){
        if(!blob){ toast(t().shotFail); shooting=false; return; }
        var file = null;
        try{ file = new File([blob], name, {type:'image/png'}); }catch(e){}
        var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if(mobile && file && navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:name}).catch(function(){}).then(function(){ shooting=false; });
        } else {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = name;
          document.body.appendChild(a); a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
          toast(t().shotDone); shooting = false;
        }
      }, 'image/png');
    }).catch(function(){
      document.body.classList.remove('capturing'); toast(t().shotFail); shooting = false;
    });
  }

  function csvCell(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }

  document.addEventListener('click', function(ev){
    var el = ev.target.closest('[data-action]');
    if(!el) return;
    var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    switch(a){
      case 'prev': goMonth(ui.y, ui.m-1); break;
      case 'next': goMonth(ui.y, ui.m+1); break;
      case 'today': now = new Date(); goMonth(now.getFullYear(), now.getMonth()); break;
      case 'lang': data.lang = el.getAttribute('data-lang'); try{ localStorage.setItem(LANG_KEY, data.lang); }catch(e){} save(); render(); break;
      case 'select': ui.sel = el.getAttribute('data-date'); ui.editingEntry = null; render(); break;
      case 'add': {
        var cid = el.getAttribute('data-cat');
        addEntry(cid, ui.drafts['c-'+cid+'-i'], ui.drafts['c-'+cid+'-m'], 'qi-'+cid, 'c-'+cid, ['-i','-m'], (ui.qRec[cid] && catById(cid) && catById(cid).monthList));
        break;
      }
      case 'add-day': {
        var sel = document.getElementById('d-cat');
        addEntry(sel ? sel.value : data.cats[0].id, ui.drafts['d-i'], ui.drafts['d-m'], 'd-i', 'd', ['-i','-m'], !!ui.dRec);
        break;
      }
      case 'del-entry':
        if(id.indexOf('r:')===0){
          var pr = id.split(':'), rr = recById(pr[1]);
          if(rr){ rr.skip = rr.skip || {}; rr.skip[pr[2]] = true; toast(t().skipped); }
        } else {
          data.entries = data.entries.filter(function(e){ return e.id!==id; });
        }
        save(); render(); break;
      case 'add-rec': addRec(el.getAttribute('data-cat')); break;
      case 'edit-budget': ui.editingBudget = true; ui.focus = 'tb-in'; render(); break;
      case 'cancel-budget': ui.editingBudget = false; render(); break;
      case 'save-budget': saveBudget(); break;
      case 'add-inc': addIncome(); break;
      case 'del-inc':
        if(id.indexOf('ri:')===0){
          var pi = id.split(':'), ir = null; data.incomeRec.forEach(function(x){ if(x.id===pi[1]) ir=x; });
          if(ir){ ir.skip = ir.skip || {}; ir.skip[pi[2]] = true; toast(t().skipped); }
        } else data.income = data.income.filter(function(e){ return e.id!==id; });
        save(); render(); break;
      case 'stop-inc-rec': {
        var r1 = null; data.incomeRec.forEach(function(x){ if(x.id===id) r1=x; }); if(!r1) break;
        var end1 = prevYm(ymKey(ui.y, ui.m));
        if(end1 < r1.start) data.incomeRec = data.incomeRec.filter(function(x){return x.id!==id;}); else r1.end = end1;
        save(); render(); break;
      }
      case 'stop-rec': {
        var r0 = recById(id); if(!r0) break;
        var cur = ymKey(ui.y, ui.m), end = prevYm(cur);
        if(end < r0.start) data.recurring = data.recurring.filter(function(x){return x.id!==id;});
        else r0.end = end;
        save(); render(); break;
      }
      case 'edit-entry':
        ui.editingEntry = id; ui.focus = 'ee-m'; render(); break;
      case 'save-entry': saveEntry(id); break;
      case 'edit-cat': {
        var c = catById(id); ui.editingCat = id; ui.catDraftColor = c ? c.color : 0; ui.catDraftSide = c ? (c.side||'L') : 'L'; ui.focus = 'cf-name'; render(); break;
      }
      case 'pick-color': {
        ui.catDraftColor = +el.getAttribute('data-i');
        var draft = readCatForm(); render(); restoreCatForm(draft); break;
      }
      case 'cancel-cat': {
        var cc = catById(ui.editingCat);
        if(cc && cc._fresh){ data.cats = data.cats.filter(function(x){return x.id!==cc.id;}); save(); }
        ui.editingCat = null; render(); break;
      }
      case 'save-cat': saveCat(id); break;
      case 'pick-side': {
        ui.catDraftSide = el.getAttribute('data-s');
        var dr = readCatForm(); render(); restoreCatForm(dr); break;
      }
      case 'pick-emoji': {
        var inp = document.getElementById('cf-emoji'); if(inp) inp.value = el.getAttribute('data-e');
        document.querySelectorAll('.emoji-grid .em').forEach(function(b){ b.classList.toggle('on', b===el); });
        break;
      }
      case 'del-cat': {
        if(data.cats.length<=1){ toast(t().lastCat); break; }
        var n = data.entries.filter(function(e){return e.cat===id;}).length + data.recurring.filter(function(r){return r.cat===id;}).length;
        if(n>0 && !confirm(t().delConfirm(n))) break;
        data.cats = data.cats.filter(function(x){return x.id!==id;});
        data.recurring = data.recurring.filter(function(r){return r.cat!==id;});
        data.entries = data.entries.filter(function(e){return e.cat!==id;});
        ui.editingCat = null; save(); render(); break;
      }
      case 'add-cat': {
        var used = data.cats.map(function(x){return x.color;});
        var col = 0; for(var i=0;i<PALETTE.length;i++){ if(used.indexOf(i)<0){ col=i; break; } col = data.cats.length % PALETTE.length; }
        var nL = data.cats.filter(function(x){return x.side!=='R';}).length, nR = data.cats.length - nL;
        var nc = {id:uid(), key:'', name:'', emoji:'🏷️', color:col, budget:0, side: nR<=nL ? 'R' : 'L', _fresh:true};
        data.cats.push(nc); ui.editingCat = nc.id; ui.catDraftColor = col; ui.catDraftSide = nc.side; ui.focus = 'cf-name'; render();
        var nm = document.getElementById('cf-name'); if(nm){ nm.value=''; nm.focus(); }
        break;
      }
      case 'csv': {
        var L = t(), rows = [['Date', L.category, L.itemPh, L.amountPh, 'Currency']];
        monthEntries().slice().sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0;}).forEach(function(e){
          var c = catById(e.cat); rows.push([e.date, c?catName(c):'', e.item, e.amount, data.currency]);
        });
        var ml = monthEntries(); rows.push([]); rows.push(['', L.totalsTitle]);
        data.cats.forEach(function(c){ rows.push(['', catName(c), '', sum(ml.filter(function(e){return e.cat===c.id;})), data.currency]); });
        rows.push(['', L.grand, '', sum(ml), data.currency]);
        var il = monthIncome(); rows.push([]); rows.push(['', L.incomeTitle]);
        il.forEach(function(e){ rows.push([e.date, L.income, e.item, e.amount, data.currency]); });
        rows.push([]); rows.push(['', L.incomeTitle, '', sum(il), data.currency]); rows.push(['', L.expenseTitle, '', sum(ml), data.currency]);
        rows.push(['', L.balance, '', Math.round((sum(il)-sum(ml))*100)/100, data.currency]);
        download('recordable-ledger-'+ymKey(ui.y,ui.m)+'.csv', '\ufeff'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n'), 'text/csv;charset=utf-8');
        break;
      }
      case 'shot': takeShot(); break;
      case 'backup':
        download('recordable-ledger-backup-'+iso(new Date())+'.json', JSON.stringify(data, null, 2), 'application/json');
        break;
      case 'restore':
        document.getElementById('restore-file').click(); break;
    }
  });

  function addIncome(){
    var amt = parseAmt(ui.drafts['inc-m']), item = String(ui.drafts['inc-i']||'').trim();
    var chk = document.getElementById('inc-rec'); ui.incRec = chk ? chk.checked : false;
    if(!(amt>0)){ toast(t().invalidAmt); ui.focus='inc-m'; render(); return; }
    if(ui.incRec){
      var d = fromIso(ui.sel);
      data.incomeRec.push({id:uid(), item:item, amount:amt, day:d.getDate(), start:ui.sel.slice(0,7), skip:{}});
    } else {
      data.income.push({id:uid(), date:ui.sel, item:item, amount:amt});
    }
    delete ui.drafts['inc-i']; delete ui.drafts['inc-m']; ui.incRec = false;
    save(); ui.focus = 'inc-i'; render();
  }

  function addRec(cid){
    var dk = 'r-'+cid, amt = parseAmt(ui.drafts[dk+'-m']), day = parseInt(ui.drafts[dk+'-d'],10);
    if(!(amt>0)){ toast(t().invalidAmt); ui.focus='rm-'+cid; render(); return; }
    if(!(day>=1 && day<=31)){ toast(t().invalidDay); ui.focus='rd-'+cid; render(); return; }
    data.recurring.push({id:uid(), cat:cid, item:String(ui.drafts[dk+'-i']||'').trim(), amount:amt, day:day, start:ymKey(ui.y,ui.m), skip:{}, over:{}});
    ['-i','-m','-d'].forEach(function(k){ delete ui.drafts[dk+k]; });
    save(); ui.focus = 'ri-'+cid; render();
  }

  function saveBudget(){
    var el = document.getElementById('tb-in'), raw = el ? el.value.trim() : '';
    var b = raw === '' ? 0 : parseAmt(raw);
    if(raw !== '' && !(b > 0)){ toast(t().invalidAmt); return; }
    data.budget = b; ui.editingBudget = false; save(); render();
  }

  function saveEntry(id){
    var amt = parseAmt(document.getElementById('ee-m').value);
    if(!(amt>0)){ toast(t().invalidAmt); return; }
    if(id.indexOf('r:')===0){
      var pr = id.split(':'), r = recById(pr[1]);
      if(r){ r.over = r.over || {}; r.over[pr[2]] = {item:document.getElementById('ee-i').value.trim(), amount:amt}; }
      ui.editingEntry = null; save(); render(); return;
    }
    var e = null; data.entries.forEach(function(x){ if(x.id===id) e=x; });
    if(!e) return;
    e.item = document.getElementById('ee-i').value.trim(); e.amount = amt;
    ui.editingEntry = null; save(); render();
  }

  function readCatForm(){
    var g = function(i){ var el=document.getElementById(i); return el?el.value:''; };
    var r = document.getElementById('cf-ml');
    return {emoji:g('cf-emoji'), name:g('cf-name'), budget:g('cf-budget'), ml: r ? r.checked : false};
  }
  function restoreCatForm(d){
    ['emoji','name','budget'].forEach(function(k){ var el=document.getElementById('cf-'+k); if(el) el.value=d[k]; });
    var r = document.getElementById('cf-ml'); if(r) r.checked = d.ml;
  }
  function saveCat(id){
    var c = catById(id); if(!c) return;
    var f = readCatForm();
    var name = f.name.trim();
    if(c.key && name === t().cats[c.key]) name = ''; // keep auto-translated default name
    c.name = name; var em = f.emoji.trim();
    if(em && window.Intl && Intl.Segmenter){ var it = new Intl.Segmenter().segment(em)[Symbol.iterator]().next(); if(!it.done) em = it.value.segment; }
    c.emoji = em || '•';
    var b = parseAmt(f.budget); c.budget = b>0 ? b : 0;
    c.color = ui.catDraftColor; c.monthList = !!f.ml; c.side = ui.catDraftSide==='R' ? 'R' : 'L'; delete c._fresh;
    ui.editingCat = null; save(); render();
  }

  document.addEventListener('input', function(ev){
    var k = ev.target.getAttribute && ev.target.getAttribute('data-draft');
    if(k) ui.drafts[k] = ev.target.value;
  });

  document.addEventListener('keydown', function(ev){
    if(ev.key !== 'Enter' || ev.isComposing) return;
    var el = ev.target, a = el.getAttribute && el.getAttribute('data-enter');
    if(el.id && el.id.indexOf('cf-')===0){ ev.preventDefault(); saveCat(ui.editingCat); return; }
    if(!a) return;
    ev.preventDefault();
    if(a==='add'){
      var cid = el.getAttribute('data-cat');
      if(el.classList.contains('qi') && !ui.drafts['c-'+cid+'-m']){ var m=document.getElementById('qm-'+cid); if(m) m.focus(); return; }
      addEntry(cid, ui.drafts['c-'+cid+'-i'], ui.drafts['c-'+cid+'-m'], 'qi-'+cid, 'c-'+cid, ['-i','-m'], (ui.qRec[cid] && catById(cid) && catById(cid).monthList));
    } else if(a==='add-day'){
      if(el.id==='d-i' && !ui.drafts['d-m']){ document.getElementById('d-m').focus(); return; }
      var sel = document.getElementById('d-cat');
      addEntry(sel.value, ui.drafts['d-i'], ui.drafts['d-m'], 'd-i', 'd', ['-i','-m'], !!ui.dRec);
    } else if(a==='add-inc'){
      if(el.id==='inc-i' && !ui.drafts['inc-m']){ document.getElementById('inc-m').focus(); return; }
      addIncome();
    } else if(a==='add-rec'){
      addRec(el.getAttribute('data-cat'));
    } else if(a==='save-budget'){
      saveBudget();
    } else if(a==='save-entry'){
      saveEntry(el.getAttribute('data-id'));
    }
  });
  document.addEventListener('keydown', function(ev){
    if(ev.key==='Escape' && ui.editingBudget){ ui.editingBudget = false; render(); return; }
    if(ev.key==='Escape' && (ui.editingEntry || ui.editingCat)){
      if(ui.editingCat){ var cc=catById(ui.editingCat); if(cc && cc._fresh){ data.cats=data.cats.filter(function(x){return x.id!==cc.id;}); save(); } }
      ui.editingEntry = null; ui.editingCat = null; render();
    }
  });

  document.addEventListener('change', function(ev){
    var el = ev.target;
    if(el.id==='year-in'){
      var y = parseInt(el.value,10);
      if(y>=1900 && y<=2100) goMonth(y, ui.m); else el.value = ui.y;
    } else if(el.id==='month-in'){
      goMonth(ui.y, parseInt(el.value,10));
    } else if(el.id==='d-rec'){
      ui.dRec = el.checked;
    } else if(el.getAttribute && el.getAttribute('data-qrec')){
      ui.qRec[el.getAttribute('data-qrec')] = el.checked;
    } else if(el.id==='cur-in'){
      data.currency = el.value; save(); render();
    } else if(el.id==='restore-file'){
      var file = el.files && el.files[0]; if(!file) return;
      var r = new FileReader();
      r.onload = function(){
        try{
          var p = JSON.parse(r.result);
          if(!p || !Array.isArray(p.cats) || !Array.isArray(p.entries) || !p.cats.length) throw 0;
          if(!confirm(t().restoreConfirm)) return;
          data = {lang: data.lang, currency: CUR[p.currency]?p.currency:'KRW', budget: p.budget>0?p.budget:0, v:Math.min(4, (p.v|0)||1), cats:p.cats, entries:p.entries.filter(function(e){ return e && typeof e.date==='string' && e.amount>0; }), recurring: Array.isArray(p.recurring)?p.recurring:[], income: Array.isArray(p.income)?p.income:[], incomeRec: Array.isArray(p.incomeRec)?p.incomeRec:[]};
          save(); render(); toast(t().restored);
        }catch(e){ toast(t().restoreFail); }
        el.value = '';
      };
      r.readAsText(file);
    }
  });

  // keep "today" correct if the tab stays open past midnight
  setInterval(function(){ var n=new Date(); if(iso(n)!==iso(now)){ now=n; render(); } }, 60000);

  render();

  // ---- 동기화 연결 (화면은 그대로, 데이터만 주고받음) ----
  var lastTyping = 0;
  document.addEventListener('input', function(){ lastTyping = Date.now(); }, true);
  if(window.LedgerSync){
    window.LedgerSync.start({
      getData: function(){ return data; },
      replaceData: function(d){
        data = d;
        try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
        if(ui.editingCat && !catById(ui.editingCat)) ui.editingCat = null;
        var a = document.activeElement; if(a && a.id && !ui.focus) ui.focus = a.id; // 커서 위치 유지
        render();
      },
      isBusy: function(){
        // 입력 중인 칸에 글자가 있거나 최근 8초 안에 타이핑했으면 "사용 중" → 화면 교체 보류
        var a = document.activeElement;
        return !!(ui.editingCat || ui.editingEntry || ui.editingBudget || shooting || (Date.now() - lastTyping < 8000) ||
          (a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox' && a.value !== ''));
      },
      toast: toast,
      lang: function(){ return data.lang; }
    });
  }
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
